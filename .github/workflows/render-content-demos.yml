name: Render YY Builds content demos

on:
  push:
    branches:
      - feature/content-engine-showcase
    paths:
      - 'remotion-demos/**'
      - '.github/workflows/render-content-demos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/content-engine-showcase

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install demo dependencies
        working-directory: remotion-demos
        run: npm install

      - name: Typecheck demos
        working-directory: remotion-demos
        run: npm run typecheck

      - name: Render three MP4 demos
        working-directory: remotion-demos
        run: npm run render

      - name: Commit rendered videos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/*.mp4
          git commit -m 'Add YY Builds content demo videos'
          git push origin HEAD:feature/content-engine-showcase
