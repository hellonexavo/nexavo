name: YY Builds — free AI bounty discovery
on:
  push:
    paths:
      - '.github/workflows/bounty-watch.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan public funded opportunities
        run: python scripts/bounty_watch.py
      - name: Save verified discovery snapshot
        run: |
          git config user.name "YY Builds Bot"
          git config user.email "yybuilds-bot@users.noreply.github.com"
          git add data/open-bounties.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh AI bounty discovery"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 5 ]; then echo "Failed to sync repository after retries" >&2; exit 1; fi
              sleep 2
            done
          fi
